<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chinese Idioms by Category — Browse by Theme</title>
  <meta name="description" content="Browse Chinese idioms by category: wisdom, action, perseverance, leadership, philosophy, and more. Find idioms that fit any theme.">
  <meta name="google-site-verification" content="nc52kSOCgX-YfWQBPfpMu4S6S1tznnIhnjxD7EvwTY4" />
  <link rel="canonical" href="https://chinese-idioms.top/categories.html">
  <style>
    :root {
      --primary: #c0392b;
      --text: #2c3e50;
      --muted: #7f8c8d;
      --bg: #fdfcf9;
      --card: #ffffff;
      --border: #ecf0f1;
      --accent: #f39c12;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }
    .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }
    header {
      background: var(--card);
      border-bottom: 3px solid var(--primary);
      padding: 16px 0;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    header .container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .logo { font-size: 22px; font-weight: 700; color: var(--primary); text-decoration: none; }
    .logo span { color: var(--text); }
    nav a { color: var(--muted); text-decoration: none; margin-left: 20px; font-size: 14px; font-weight: 500; }
    nav a:hover { color: var(--primary); }

    .page-title {
      background: linear-gradient(135deg, #c0392b 0%, #922b21 100%);
      color: white;
      padding: 50px 0;
      text-align: center;
    }
    .page-title h1 { font-size: 36px; margin-bottom: 8px; }
    .page-title p { opacity: 0.85; font-size: 16px; }

    main { padding: 40px 0; }
    .category-block {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .category-block h2 {
      font-size: 22px;
      color: var(--primary);
      margin-bottom: 4px;
    }
    .category-block .count { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
    .idiom-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }
    .idiom-list a {
      display: block;
      padding: 10px 14px;
      background: #fef9f2;
      border-radius: 6px;
      text-decoration: none;
      color: var(--text);
      border-left: 3px solid var(--accent);
    }
    .idiom-list a:hover { background: var(--accent); color: white; }
    .idiom-list .ch { font-weight: 700; color: var(--primary); display: block; }
    .idiom-list a:hover .ch { color: white; }
    .idiom-list .py { font-size: 12px; color: var(--muted); font-style: italic; }

    footer {
      background: var(--text);
      color: #bdc3c7;
      padding: 30px 0;
      text-align: center;
      font-size: 13px;
    }
    footer a { color: var(--accent); text-decoration: none; }

    @media (max-width: 600px) {
      .page-title h1 { font-size: 28px; }
      nav a { margin-left: 12px; font-size: 13px; }
    }
  </style>
</head>
<body>

<header>
  <div class="container">
    <a href="index.html" class="logo">成语<span>Dict</span></a>
    <nav>
      <a href="index.html">All Idioms</a>
      <a href="categories.html">Categories</a>
      <a href="about.html">About</a>
    </nav>
  </div>
</header>

<section class="page-title">
  <div class="container">
    <h1>Browse by Category</h1>
    <p>Find Chinese idioms grouped by theme and topic</p>
  </div>
</section>

<div class="container">
  <main>
    {{CATEGORY_BLOCKS}}
  </main>
</div>

<footer>
  <div class="container">
    <p>Chinese Idiom Dictionary · A free reference for classical Chinese idioms</p>
    <p style="margin-top: 8px;"><a href="index.html">Browse all idioms</a> · <a href="about.html">About</a></p>
  </div>
</footer>

</body>
</html>
